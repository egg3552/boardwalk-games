<!DOCTYPE html>
<html lang="en">
    <head>
        <!-- Basic meta tags for character encoding and responsive design -->
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Boardwalk Games, your ultimate gaming retreat! Perfect for casual gamers, enthusiasts, and student gatherings. Visit us for your next adventure in board gaming.">

        <link rel="icon" type="image/png" sizes="32x32"
            href="assets/images/favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16"
            href="assets/images/favicon-16x16.png">

        <!-- Link to external CSS stylesheet -->
        <link rel="stylesheet" href="style.css">
        
        <!-- Bootstrap CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

        <!-- Google Fonts - Inter font family -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
            rel="stylesheet">

        <!-- Google Fonts - Macondo font family -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link
            href="https://fonts.googleapis.com/css2?family=Macondo&display=swap"
            rel="stylesheet">

        <!-- Font Awesome icons library -->
        <script src="https://kit.fontawesome.com/ca5bbdb6cc.js"
            crossorigin="anonymous"></script>
    </head>
    <body class="d-flex flex-column min-vh-100">
        <!-- Bootstrap 5 Responsive Navbar -->
        <nav id="navbar" class="navbar navbar-expand-lg navbar-dark">
            <div class="container">
                <!-- Navbar Brand -->
                <a class="navbar-brand" href="index.html">
                    <img src="assets/images/logo-sm-white.png"
                        alt="Boardwalk Games" width="30"
                        class="d-inline-block align-text-top">
                </a>

                <!-- Book Now Button (visible on all screens) -->
                <a class="btn btn-primary ms-2" href="booking.html">Book Now</a>

                <!-- Mobile Toggle Button -->
                <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false"
                    aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                
                <!-- Navbar Links (collapsed on mobile/tablet) -->
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="game-library.html">Games</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="services.html">Services</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="contact.html">Contact</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <!-- Main content with booking form -->
        <main class="flex-grow-1 py-5">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-12 col-lg-8">
                        <h1 class="display-4 text-center mb-5">BOOKING INQUIRY</h1>
                        
                        <form id="bookingForm" class="booking-form" name="booking" method="POST" data-netlify="true" netlify-honeypot="bot-field">
                            <!-- Hidden field for bot detection -->
                            <input type="hidden" name="form-name" value="booking">
                            <div style="display: none;">
                                <label>Don't fill this out if you're human: <input name="bot-field" /></label>
                            </div>
                            <div class="row mb-4">
                                <div class="col-md-6">
                                    <label for="name" class="form-label">Name</label>
                                    <input type="text" class="form-control form-control-lg" id="name" name="name" placeholder="Jo" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="email" class="form-label">Email</label>
                                    <input type="email" class="form-control form-control-lg" id="email" name="email" placeholder="jo@email.com" required>
                                </div>
                            </div>
                            
                            <div class="row mb-4">
                                <div class="col-md-6">
                                    <label for="phone" class="form-label">Phone number</label>
                                    <input type="tel" class="form-control form-control-lg" id="phone" name="phone" placeholder="123456789" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="eventType" class="form-label">Event type</label>
                                    <select class="form-select form-select-lg" id="eventType" name="eventType" required>
                                        <option value="">Select event type</option>
                                        <option value="retro-game-night" selected>Retro Game Night</option>
                                        <option value="birthday-party">Birthday Party</option>
                                        <option value="corporate-event">Corporate Event</option>
                                        <option value="student-gathering">Student Gathering</option>
                                        <option value="casual-gaming">Casual Gaming Session</option>
                                        <option value="tournament">Tournament</option>
                                        <option value="other">Other</option>
                                    </select>
                                </div>
                            </div>
                            
                            <div class="mb-4">
                                <label for="message" class="form-label">Message</label>
                                <textarea class="form-control form-control-lg" id="message" name="message" rows="6" placeholder="Tell us about your event, preferred dates, number of guests, and any special requirements..."></textarea>
                            </div>
                            
                            <div class="text-center">
                                <button type="submit" class="btn btn-primary btn-lg px-5">Submit</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>

        <!-- Footer section with contact info and opening times -->
        <footer class="mt-auto section">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-12 text-center">
                        <h2 class="display-4">CONTACT US!</h2>
                    </div>
                    <div class="col-12 col-md-6 col-xl-4">
                        <h3 class="sub-heading-color">Contact info</h3>
                        <p><i class="fas fa-map-marker-alt"></i> <strong>Boardwalk Games</strong><br>
                        123 Boardwalk<br>
                        Boardwalk City, 12345</p>
                        
                        <p><i class="fas fa-phone"></i> 012 345 6789<br>
                        <i class="fas fa-envelope"></i> info@boardwalk-games.co</p>
                        
                        <div class="social-links">
                            <a href="https://www.instagram.com" target="_blank" rel="noopener noreferrer" aria-label="Follow us on Instagram">
                                <i class="fab fa-instagram"></i>
                            </a>
                            <a href="https://www.facebook.com" target="_blank" rel="noopener noreferrer" aria-label="Follow us on Facebook">
                                <i class="fab fa-facebook-f"></i>
                            </a>
                            <a href="https://www.x.com" target="_blank" rel="noopener noreferrer" aria-label="Follow us on X">
                                <i class="fab fa-x-twitter"></i>
                            </a>
                        </div>
                    </div>
                    <div class="col-12 col-md-6 col-xl-4">
                        <h3 class="sub-heading-color">Opening times</h3>
                        <table class="opening-times-table">
                            <thead>
                                <tr>
                                    <th>Day</th>
                                    <th>Open</th>
                                    <th>Close</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>Mon</td>
                                    <td colspan="2">Closed</td>
                                </tr>
                                <tr>
                                    <td>Tue - Thur</td>
                                    <td>11am</td>
                                    <td>11pm</td>
                                </tr>
                                <tr>
                                    <td>Fri - Sat</td>
                                    <td>11am</td>
                                    <td>12am</td>
                                </tr>
                                <tr>
                                    <td>Sun</td>
                                    <td>12pm</td>
                                    <td>7pm</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </footer>
        
        <!-- Back to Top Button -->
        <button class="back-to-top" id="backToTop" onclick="scrollToTop()" aria-label="Back to top">
            <i class="fas fa-arrow-up"></i>
        </button>
        
        <!-- Bootstrap 5 JavaScript Bundle for navbar toggle functionality -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        
        <!-- Booking Form JavaScript -->
        <script>
            document.getElementById('bookingForm').addEventListener('submit', function(e) {
                // Clear previous validation states
                this.querySelectorAll('.form-control, .form-select').forEach(field => {
                    field.classList.remove('is-valid', 'is-invalid');
                    const feedback = field.parentElement.querySelector('.invalid-feedback');
                    if (feedback) feedback.remove();
                });

                // Get form data
                const formData = new FormData(this);
                const data = {
                    name: formData.get('name'),
                    email: formData.get('email'),
                    phone: formData.get('phone'),
                    eventType: formData.get('eventType'),
                    message: formData.get('message')
                };
                
                let isValid = true;
                
                // Enhanced validation with visual feedback
                if (!data.name || data.name.trim().length < 2) {
                    this.showFieldError('name', 'Please enter a valid name (at least 2 characters)');
                    isValid = false;
                } else {
                    this.showFieldSuccess('name');
                }
                
                // Email validation
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!data.email || !emailRegex.test(data.email)) {
                    this.showFieldError('email', 'Please enter a valid email address');
                    isValid = false;
                } else {
                    this.showFieldSuccess('email');
                }
                
                // Phone validation
                const phoneRegex = /^[0-9\s\-\+\(\)]{10,}$/;
                if (!data.phone || !phoneRegex.test(data.phone)) {
                    this.showFieldError('phone', 'Please enter a valid phone number (at least 10 digits)');
                    isValid = false;
                } else {
                    this.showFieldSuccess('phone');
                }
                
                if (!data.eventType) {
                    this.showFieldError('eventType', 'Please select an event type');
                    isValid = false;
                } else {
                    this.showFieldSuccess('eventType');
                }
                
                if (!isValid) {
                    e.preventDefault();
                    return;
                }
                
                // Show loading state
                const submitBtn = this.querySelector('button[type="submit"]');
                const originalText = submitBtn.innerHTML;
                submitBtn.innerHTML = '<span class="loading-spinner"></span>Submitting...';
                submitBtn.disabled = true;
                submitBtn.style.pointerEvents = 'none';
                
                // If not on Netlify, prevent default and show message
                if (!window.location.hostname.includes('netlify')) {
                    e.preventDefault();
                    setTimeout(() => {
                        // Success animation
                        submitBtn.innerHTML = '<i class="fas fa-check me-2"></i>Success!';
                        submitBtn.style.backgroundColor = '#28a745';
                        
                        setTimeout(() => {
                            alert('Thank you for your booking inquiry! In a production environment, this would be sent to our team. We will contact you within 24 hours to confirm your event details.');
                            this.reset();
                            this.querySelectorAll('.form-control, .form-select').forEach(field => {
                                field.classList.remove('is-valid', 'is-invalid');
                            });
                            submitBtn.innerHTML = originalText;
                            submitBtn.disabled = false;
                            submitBtn.style.pointerEvents = 'auto';
                            submitBtn.style.backgroundColor = '';
                        }, 2000);
                    }, 1500);
                }
            });
            
            // Helper functions for validation feedback
            document.getElementById('bookingForm').showFieldError = function(fieldName, message) {
                const field = this.querySelector(`[name="${fieldName}"]`);
                field.classList.add('is-invalid');
                field.classList.remove('is-valid');
                
                // Remove existing feedback
                const existingFeedback = field.parentElement.querySelector('.invalid-feedback');
                if (existingFeedback) existingFeedback.remove();
                
                // Add error message
                const feedback = document.createElement('div');
                feedback.className = 'invalid-feedback';
                feedback.textContent = message;
                field.parentElement.appendChild(feedback);
            };
            
            document.getElementById('bookingForm').showFieldSuccess = function(fieldName) {
                const field = this.querySelector(`[name="${fieldName}"]`);
                field.classList.add('is-valid');
                field.classList.remove('is-invalid');
                
                // Remove existing feedback
                const existingFeedback = field.parentElement.querySelector('.invalid-feedback');
                if (existingFeedback) existingFeedback.remove();
            };
            
            // Real-time validation
            document.querySelectorAll('#bookingForm .form-control, #bookingForm .form-select').forEach(field => {
                field.addEventListener('blur', function() {
                    const form = document.getElementById('bookingForm');
                    const value = this.value.trim();
                    
                    switch(this.name) {
                        case 'name':
                            if (value && value.length >= 2) {
                                form.showFieldSuccess('name');
                            } else if (value) {
                                form.showFieldError('name', 'Name must be at least 2 characters');
                            }
                            break;
                        case 'email':
                            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                            if (value && emailRegex.test(value)) {
                                form.showFieldSuccess('email');
                            } else if (value) {
                                form.showFieldError('email', 'Please enter a valid email address');
                            }
                            break;
                        case 'phone':
                            const phoneRegex = /^[0-9\s\-\+\(\)]{10,}$/;
                            if (value && phoneRegex.test(value)) {
                                form.showFieldSuccess('phone');
                            } else if (value) {
                                form.showFieldError('phone', 'Please enter a valid phone number');
                            }
                            break;
                        case 'eventType':
                            if (value) {
                                form.showFieldSuccess('eventType');
                            }
                            break;
                    }
                });
            });
            
            // Add smooth focus transitions
            document.querySelectorAll('.form-control, .form-select').forEach(element => {
                element.addEventListener('focus', function() {
                    this.parentElement.style.transform = 'scale(1.02)';
                    this.parentElement.style.transition = 'transform 0.2s ease';
                });
                
                element.addEventListener('blur', function() {
                    this.parentElement.style.transform = 'scale(1)';
                });
            });
        </script>
        
        <!-- Back to Top Script -->
        <script>
            // Show/hide back to top button based on scroll position
            window.addEventListener('scroll', function() {
                const backToTop = document.getElementById('backToTop');
                if (window.pageYOffset > 300) {
                    backToTop.classList.add('show');
                } else {
                    backToTop.classList.remove('show');
                }
            });
            
            // Smooth scroll to top function
            function scrollToTop() {
                window.scrollTo({
                    top: 0,
                    behavior: 'smooth'
                });
            }
        </script>
    </body>
</html>
